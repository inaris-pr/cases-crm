# Continuous integration for Cases CRM.
#
# Runs the same two gates a developer runs before calling work done
# (see CLAUDE.md): `pnpm typecheck` and `pnpm test`. Either failing fails
# the run.
#
# Data safety: the live store (artifacts/api-server/data/store.json) is
# git-ignored, so it is never in the checkout. The test suite runs every file
# from a throwaway temp directory (artifacts/api-server/test/setup.ts), and
# the guard steps below fail the run if a live store ever appears in the
# repository before or after the tests. Nothing is uploaded: this workflow
# publishes no artifacts and uses no secrets, databases or external services.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" requires Node >= 20: test the minimum it
        # promises, and the LTS line above it.
        node: [20, 22]
    env:
      LIVE_STORE: artifacts/api-server/data/store.json
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a
      # moved or compromised tag cannot change what runs here.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config for later steps.
          persist-credentials: false

      - name: Confirm the live store is not in the repository
        run: |
          if git ls-files --error-unmatch "$LIVE_STORE" >/dev/null 2>&1; then
            echo "::error file=$LIVE_STORE::The live store must never be committed. Remove it from Git (it is git-ignored)."
            exit 1
          fi
          if [ -e "$LIVE_STORE" ]; then
            echo "::error::$LIVE_STORE exists in the checkout; refusing to run."
            exit 1
          fi
          echo "OK: no live store in the checkout."

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Must equal "packageManager" in package.json (pnpm@9.0.0); the
          # action fails the run if the two ever disagree.
          version: 9.0.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Caches the pnpm store, keyed on the lockfile.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # pnpm -r run typecheck: api-server (src + tests), cases (web), lib/db.
        run: pnpm typecheck

      - name: Test
        # pnpm -r run test: the Vitest + Supertest suite in
        # artifacts/api-server/test, on isolated temp-directory data.
        run: pnpm test

      - name: Confirm the tests left the repository untouched
        if: ${{ !cancelled() }}
        run: |
          if [ -e "$LIVE_STORE" ]; then
            echo "::error::$LIVE_STORE was created during the run; test isolation is broken."
            exit 1
          fi
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "::error::The run modified or created files in the repository:"
            echo "$changes"
            exit 1
          fi
          echo "OK: repository unchanged; no live store written."
